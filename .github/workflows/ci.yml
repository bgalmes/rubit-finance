name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q --cov=rubit --cov-report=term-missing
      - name: Domain maths is fully covered
        run: uv run pytest -q tests/domain --cov=rubit.domain --cov-fail-under=100
      - name: OpenAPI schema is up to date
        run: |
          uv run rubit-openapi openapi.json
          git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code app/types/openapi.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
