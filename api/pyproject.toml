[project]
name = "rubit-finance"
version = "0.1.0"
description = "Personal finance tools. MVP: mortgage calculator with French amortization."
authors = [
    { name = "bgalmes", email = "bernatgalmesrules@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "platformdirs>=4.11.12",
    "sqlmodel>=0.0.46",
    "uvicorn>=0.53.0",
]

[project.scripts]
rubit = "rubit.__main__:main"
rubit-openapi = "rubit.api.openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubit"]
# The SPA is copied into src/rubit/static by scripts/build.sh and is git-ignored.
artifacts = ["src/rubit/static/**"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["rubit"]
omit = ["src/rubit/__main__.py", "src/rubit/api/openapi.py"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

# Merges to main produce release candidates (prepared on release/next).
[tool.semantic_release.branches.main]
match = "^(main|release/next)$"
prerelease = true
prerelease_token = "rc"

# The "Promote to stable" workflow drops the -rc.N suffix on release/promote.
[tool.semantic_release.branches.promote]
match = "^release/promote$"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\)"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "../CHANGELOG.md"

[dependency-groups]
dev = [
    "fastapi-cli[standard]>=0.0.32",
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.fastapi]
entrypoint = "rubit.api.app:app"
